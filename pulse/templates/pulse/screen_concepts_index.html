<!doctype html>
{% load static %}
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Pulse — screen concepts</title>
  <link rel="stylesheet" href="{% static 'pulse/style.css' %}">
</head>
<body>
  <div style="max-width:32rem;margin:3rem auto;padding:0 1.5rem">
    <p class="screen-word" style="font-size:2rem">Screen <span>concepts</span></p>
    <p style="color:var(--mist)">
      10 frozen mockups, one real reception-data snapshot baked into each — not wired to
      the live host console yet, see PLAN.md. Scales to fit this device.
    </p>
    <ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:0.6rem">
      {% for n, title in concepts %}
        <li>
          <a class="card" style="display:block;padding:0.9rem 1.1rem" href="{% url 'screen-concept' n %}">{{ title }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
