<div class="stage">

  <!-- paper grain + soft watercolor washes -->
  <svg class="layer" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0 0.13  0 0 0 0.045 0"/>
      </filter>
      <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="70"/>
      </filter>
    </defs>
    <ellipse cx="330" cy="230" rx="360" ry="260" fill="#c98a83" opacity="0.07" filter="url(#soft-blur)"/>
    <ellipse cx="1610" cy="860" rx="380" ry="280" fill="#8a9873" opacity="0.08" filter="url(#soft-blur)"/>
    <ellipse cx="1680" cy="150" rx="300" ry="220" fill="#c9a45f" opacity="0.05" filter="url(#soft-blur)"/>
    <rect x="0" y="0" width="1920" height="1080" filter="url(#grain)"/>
  </svg>

  <!-- hairline stationery frame -->
  <svg class="layer" viewBox="0 0 1920 1080" width="1920" height="1080">
    <rect class="frame-rect" x="54" y="54" width="1812" height="972"/>
    <rect class="frame-rect" x="66" y="66" width="1788" height="948" opacity="0.6"/>
  </svg>

  <!-- botanical corner sprigs -->
  <svg class="layer" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <g id="leaf">
        <path d="M0,0 C -7,-16 -5,-35 0,-50 C 5,-35 7,-16 0,0 Z"
              fill="#8a9873" fill-opacity="0.5" stroke="#62704c" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M0,-3 C 0,-17 0,-33 0,-47" fill="none" stroke="#62704c" stroke-width="0.9" stroke-opacity="0.55"/>
      </g>
      <g id="leaf-r">
        <path d="M0,0 C -7,-16 -5,-35 0,-50 C 5,-35 7,-16 0,0 Z"
              fill="#c98a83" fill-opacity="0.42" stroke="#9c5a52" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M0,-3 C 0,-17 0,-33 0,-47" fill="none" stroke="#9c5a52" stroke-width="0.9" stroke-opacity="0.5"/>
      </g>
      <g id="bud">
        <path d="M0,0 C -5,-11 -4,-23 0,-30 C 4,-23 5,-11 0,0 Z"
              fill="#b97b73" fill-opacity="0.48" stroke="#9c5a52" stroke-width="1.2"/>
        <path d="M-4,-3 C -6,-5 -6,-8 -4,-10" fill="none" stroke="#62704c" stroke-width="0.9"/>
        <path d="M4,-3 C 6,-5 6,-8 4,-10" fill="none" stroke="#62704c" stroke-width="0.9"/>
      </g>
      <g id="blossom">
        <g stroke="#9c5a52" stroke-width="1.1" fill="#c98a83" fill-opacity="0.46">
          <ellipse cx="0" cy="-11" rx="7" ry="12"/>
          <ellipse cx="0" cy="-11" rx="7" ry="12" transform="rotate(72)"/>
          <ellipse cx="0" cy="-11" rx="7" ry="12" transform="rotate(144)"/>
          <ellipse cx="0" cy="-11" rx="7" ry="12" transform="rotate(216)"/>
          <ellipse cx="0" cy="-11" rx="7" ry="12" transform="rotate(288)"/>
        </g>
        <circle r="4.2" fill="#c9a45f" stroke="#a9803f" stroke-width="0.8"/>
      </g>
    </defs>

    <!-- top-left -->
    <g>
      <path d="M14,18 C 90,4 168,36 232,108" fill="none" stroke="#7c8c70" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#bud" x="34" y="34" transform="rotate(200 34 34)"/>
      <use href="#leaf" x="78" y="22" transform="rotate(-56 78 22)"/>
      <use href="#leaf-r" x="140" y="42" transform="rotate(-28 140 42) scale(-1,1) translate(-280,0)"/>
      <use href="#leaf" x="196" y="76" transform="rotate(6 196 76)"/>
      <use href="#blossom" x="234" y="112" transform="rotate(18 234 112) scale(1.15)"/>
    </g>

    <!-- top-right (mirrored) -->
    <g transform="translate(1920,0) scale(-1,1)">
      <path d="M14,18 C 90,4 168,36 232,108" fill="none" stroke="#7c8c70" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#bud" x="34" y="34" transform="rotate(200 34 34)"/>
      <use href="#leaf" x="78" y="22" transform="rotate(-56 78 22)"/>
      <use href="#leaf-r" x="140" y="42" transform="rotate(-28 140 42) scale(-1,1) translate(-280,0)"/>
      <use href="#leaf" x="196" y="76" transform="rotate(6 196 76)"/>
      <use href="#blossom" x="234" y="112" transform="rotate(18 234 112) scale(1.15)"/>
    </g>

    <!-- bottom-left -->
    <g transform="translate(0,1080) scale(1,-1)">
      <path d="M14,18 C 96,2 176,30 246,96" fill="none" stroke="#7c8c70" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#bud" x="36" y="32" transform="rotate(196 36 32)"/>
      <use href="#leaf-r" x="86" y="18" transform="rotate(-60 86 18)"/>
      <use href="#leaf" x="150" y="40" transform="rotate(-24 150 40)"/>
      <use href="#leaf-r" x="204" y="68" transform="rotate(10 204 68)"/>
      <use href="#blossom" x="248" y="100" transform="rotate(-8 248 100) scale(1.25)"/>
      <use href="#leaf" x="292" y="118" transform="rotate(20 292 118) scale(0.8)"/>
    </g>

    <!-- bottom-right (mirrored) -->
    <g transform="translate(1920,1080) scale(-1,-1)">
      <path d="M14,18 C 96,2 176,30 246,96" fill="none" stroke="#7c8c70" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#bud" x="36" y="32" transform="rotate(196 36 32)"/>
      <use href="#leaf-r" x="86" y="18" transform="rotate(-60 86 18)"/>
      <use href="#leaf" x="150" y="40" transform="rotate(-24 150 40)"/>
      <use href="#leaf-r" x="204" y="68" transform="rotate(10 204 68)"/>
      <use href="#blossom" x="248" y="100" transform="rotate(-8 248 100) scale(1.25)"/>
      <use href="#leaf" x="292" y="118" transform="rotate(20 292 118) scale(0.8)"/>
    </g>

    <!-- slender mid-edge sprigs, left and right -->
    <g transform="translate(58,540)">
      <path d="M0,-70 C 14,-24 14,24 0,70" fill="none" stroke="#7c8c70" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
      <use href="#leaf" x="4" y="-46" transform="rotate(70 4 -46) scale(0.75)"/>
      <use href="#leaf-r" x="8" y="0" transform="rotate(90 8 0) scale(-0.75,0.75) translate(-16,0)"/>
      <use href="#leaf" x="4" y="46" transform="rotate(110 4 46) scale(0.75)"/>
    </g>
    <g transform="translate(1862,540) scale(-1,1)">
      <path d="M0,-70 C 14,-24 14,24 0,70" fill="none" stroke="#7c8c70" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
      <use href="#leaf" x="4" y="-46" transform="rotate(70 4 -46) scale(0.75)"/>
      <use href="#leaf-r" x="8" y="0" transform="rotate(90 8 0) scale(-0.75,0.75) translate(-16,0)"/>
      <use href="#leaf" x="4" y="46" transform="rotate(110 4 46) scale(0.75)"/>
    </g>
  </svg>

  <!-- top copy -->
  <div class="eyebrow">Party Pulse &middot; Resultat</div>
  <div class="headline">Tror du att brudparet skaffar husdjur f&ouml;re barn?</div>

  <svg class="divider" viewBox="0 0 300 40">
    <line x1="6" y1="20" x2="126" y2="20" stroke="#a9803f" stroke-width="1" opacity="0.55"/>
    <line x1="174" y1="20" x2="294" y2="20" stroke="#a9803f" stroke-width="1" opacity="0.55"/>
    <g transform="translate(150,26)">
      <g stroke="#9c5a52" stroke-width="1" fill="#c98a83" fill-opacity="0.5">
        <ellipse cx="0" cy="-9" rx="5.5" ry="9.5"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9.5" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#c9a45f" stroke="#a9803f" stroke-width="0.7"/>
    </g>
  </svg>

  <!-- central visual: the near-even split -->
  <div class="visual">
    <div class="num nej">48,9%</div>
    <div class="num ja">51,1%</div>
    <div class="num-label nej">Nej</div>
    <div class="num-label ja">Ja</div>

    <div class="guideline"></div>
    <div class="guideline-tag">mitten</div>

    <div class="track-wrap">
      <div class="track-seg nej"></div>
      <div class="track-seg ja"></div>
      <div class="track-seam"></div>
      <div class="track-outline"></div>
    </div>

    <svg class="tendril" viewBox="0 0 220 110">
      <path d="M47,8 C 90,30 140,58 190,86" fill="none" stroke="#a9803f" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="1 5" stroke-linecap="round"/>
    </svg>

    <svg class="marker" width="64" height="64" viewBox="-24 -24 48 48">
      <g stroke="#9c5a52" stroke-width="1.2" fill="#c98a83" fill-opacity="0.75">
        <ellipse cx="0" cy="-11" rx="7.5" ry="13"/>
        <ellipse cx="0" cy="-11" rx="7.5" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="7.5" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="7.5" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="7.5" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="4.6" fill="#c9a45f" stroke="#a9803f" stroke-width="1"/>
    </svg>

    <div class="note">n&auml;stan mitt itu</div>
  </div>

  <!-- bottom -->
  <svg class="rule" viewBox="0 0 200 26">
    <line x1="0" y1="13" x2="86" y2="13" stroke="#a9803f" stroke-width="1" opacity="0.5"/>
    <line x1="114" y1="13" x2="200" y2="13" stroke="#a9803f" stroke-width="1" opacity="0.5"/>
    <path d="M100,6 L104,13 L100,20 L96,13 Z" fill="#c9a45f" fill-opacity="0.7" stroke="#a9803f" stroke-width="0.8"/>
  </svg>
  <div class="count"><b>133</b> svar</div>
  <div class="subcount">gissningarna landade n&auml;ra mitten</div>

</div>
