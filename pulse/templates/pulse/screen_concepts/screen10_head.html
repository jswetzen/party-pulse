  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#000000;
      --ph:#32ff6a;
      --ph-dim:rgba(50,255,106,0.62);
      --ph-faint:rgba(50,255,106,0.30);
      --ph-ghost:rgba(50,255,106,0.14);
      --mono:'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Consolas,'Courier New',monospace;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    .root{
      width:1920px;
      height:1080px;
      background:var(--bg);
      color:var(--ph);
      font-family:var(--mono);
      position:relative;
      overflow:hidden;
      padding:56px 72px;
      display:flex;
      flex-direction:column;
    }

    /* ---------- CRT dressing ---------- */
    .scanlines{
      position:absolute; inset:0; pointer-events:none; z-index:5;
      background:repeating-linear-gradient(
        to bottom,
        rgba(50,255,106,0.05) 0px,
        rgba(50,255,106,0.05) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode:screen;
    }
    .vignette{
      position:absolute; inset:0; pointer-events:none; z-index:4;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    }
    .flicker{
      position:absolute; inset:0; pointer-events:none; z-index:6;
      background:rgba(0,0,0,0);
      animation:flicker 7s infinite;
    }
    @keyframes flicker{
      0%,100%{ opacity:0; }
      92%{ opacity:0; }
      93%{ opacity:0.05; }
      94%{ opacity:0; }
      96.5%{ opacity:0.03; }
      97%{ opacity:0; }
    }
    @keyframes blink{
      0%,49%{ opacity:1; }
      50%,100%{ opacity:0; }
    }

    .glow{
      text-shadow:
        0 0 2px rgba(50,255,106,0.9),
        0 0 10px rgba(50,255,106,0.55),
        0 0 26px rgba(50,255,106,0.28);
    }
    .glow-soft{
      text-shadow:
        0 0 2px rgba(50,255,106,0.7),
        0 0 8px rgba(50,255,106,0.35);
    }

    /* ---------- terminal window frame ---------- */
    .win{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      position:relative;
      z-index:2;
    }

    .line{ display:flex; width:100%; }

    .corner{
      flex:none;
      width:26px;
      font-size:24px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--ph-dim);
    }

    pre.hrule{
      flex:1;
      min-width:0;
      overflow:hidden;
      white-space:pre;
      font-family:var(--mono);
      font-size:24px;
      line-height:1;
      letter-spacing:0;
      color:var(--ph-faint);
      display:flex;
      align-items:center;
    }

    pre.vrule{
      flex:none;
      width:26px;
      overflow:hidden;
      white-space:pre;
      font-family:var(--mono);
      font-size:22px;
      line-height:1.32;
      text-align:center;
      color:var(--ph-faint);
      height:100%;
    }

    .rule-row{ height:26px; align-items:center; }

    /* ---------- title row ---------- */
    .title-row{ height:118px; }
    .title-inner{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 34px;
    }
    .title-left{ display:flex; align-items:baseline; gap:22px; }
    .sys-tag{
      font-size:22px;
      font-weight:700;
      letter-spacing:0.12em;
      color:#000;
      background:var(--ph);
      padding:5px 12px;
    }
    .title-text{
      font-size:44px;
      font-weight:700;
      letter-spacing:0.03em;
      color:var(--ph);
    }
    .title-sub{
      font-size:19px;
      letter-spacing:0.08em;
      color:var(--ph-dim);
      margin-top:6px;
    }
    .title-right{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:20px;
      letter-spacing:0.1em;
      color:var(--ph-dim);
      text-align:right;
    }
    .live-dot{
      width:14px; height:14px;
      background:var(--ph);
      box-shadow:0 0 6px var(--ph), 0 0 16px var(--ph);
      animation:blink 1.1s steps(1) infinite;
      flex:none;
    }

    /* ---------- body / stat grid ---------- */
    .body-row{ flex:1; min-height:0; }
    .grid{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
    }
    .grid-row{ flex:1; min-height:0; display:flex; }
    .grid-hrule{ height:26px; display:flex; align-items:center; }

    .cell{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:22px;
      padding:38px 58px;
    }
    .cell-head{
      display:flex;
      align-items:baseline;
      gap:18px;
    }
    .idx{
      font-size:22px;
      font-weight:600;
      color:var(--ph-dim);
      letter-spacing:0.05em;
    }
    .label{
      font-size:26px;
      font-weight:600;
      letter-spacing:0.06em;
      color:var(--ph);
    }
    .metric-tag{
      margin-left:auto;
      font-size:17px;
      font-weight:600;
      letter-spacing:0.14em;
      color:#000;
      background:var(--ph-dim);
      padding:3px 10px;
      flex:none;
    }
    .cell-value{
      display:flex;
      align-items:baseline;
      gap:20px;
    }
    .num{
      font-size:172px;
      font-weight:800;
      line-height:1;
      letter-spacing:-0.01em;
      color:var(--ph);
    }
    .unit{
      font-size:34px;
      font-weight:600;
      letter-spacing:0.05em;
      color:var(--ph-dim);
    }
    .cell-foot{
      font-size:20px;
      letter-spacing:0.08em;
      color:var(--ph-dim);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .cell-foot::before{
      content:"›";
      color:var(--ph-faint);
      font-weight:700;
    }

    /* ---------- footer prompt ---------- */
    .footer-row{ height:96px; }
    .footer-inner{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      padding:0 34px;
      font-size:26px;
      letter-spacing:0.02em;
      gap:2px;
    }
    .prompt-user{ color:var(--ph); font-weight:700; }
    .prompt-cmd{ color:var(--ph-dim); font-weight:500; margin-left:14px; }
    .cursor{
      display:inline-block;
      width:16px;
      height:30px;
      background:var(--ph);
      margin-left:10px;
      box-shadow:0 0 8px var(--ph);
      animation:blink 1s steps(1) infinite;
    }

    .bottom-row{ height:26px; }
  </style>
