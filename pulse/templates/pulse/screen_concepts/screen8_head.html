  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }

    .screen {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 900px 500px at 50% 8%, rgba(0,0,0,0.35), transparent 60%),
        linear-gradient(180deg, #4a2f1c 0%, #5b391f 6%, #4a2f1c 100%);
      font-family: 'Caveat', 'Segoe Script', cursive;
    }

    /* ---------- wood frame texture ---------- */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg,
          rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px,
          transparent 1px, transparent 5px,
          rgba(255,255,255,0.03) 5px, rgba(255,255,255,0.03) 6px,
          transparent 6px, transparent 11px);
      pointer-events: none;
    }

    /* ---------- the blackboard panel ---------- */
    .board {
      position: absolute;
      left: 42px; top: 42px; right: 42px; bottom: 42px;
      border-radius: 10px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 1400px 800px at 50% 38%, #323a37 0%, #232a28 55%, #181d1c 100%);
      box-shadow:
        inset 0 0 0 3px rgba(0,0,0,0.5),
        inset 0 0 90px 20px rgba(0,0,0,0.55);
    }

    /* chalk-dust grain, pure CSS, no image asset */
    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 2px 3px;
      mix-blend-mode: overlay;
      opacity: 0.75;
      pointer-events: none;
    }

    /* soft eraser smudges */
    .board::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 14% 82%, rgba(255,255,255,0.05), transparent 26%),
        radial-gradient(circle at 88% 78%, rgba(255,255,255,0.045), transparent 24%),
        radial-gradient(circle at 22% 12%, rgba(255,255,255,0.03), transparent 22%),
        radial-gradient(circle at 78% 18%, rgba(255,255,255,0.035), transparent 20%),
        radial-gradient(circle at 50% 96%, rgba(255,255,255,0.08), transparent 40%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 118px 110px 76px;
    }

    /* ---------- chalk color tokens ---------- */
    .chalk-cream  { color: #f2ecdc; }
    .chalk-yellow { color: #f3d98a; }
    .chalk-pink   { color: #f0b3c4; }

    .rough {
      filter: url(#chalkRough);
    }

    /* ---------- kicker row ---------- */
    .kicker-row {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .kicker {
      font-family: 'Permanent Marker', 'Segoe UI', cursive;
      font-size: 30px;
      letter-spacing: 6px;
      color: #f0b3c4;
      text-shadow: 0 0 10px rgba(240,179,196,0.35);
    }
    .kicker-icon { width: 38px; height: 38px; flex: none; opacity: 0.92; }
    .kicker-icon path, .kicker-icon line { stroke: #f2ecdc; }

    .underline-doodle { width: 360px; height: 22px; margin-top: 6px; opacity: 0.85; }
    .underline-doodle path { stroke: #f0b3c4; }

    /* ---------- the question, menu-board style ---------- */
    .question {
      margin-top: 26px;
      max-width: 1240px;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 42px;
      line-height: 1.25;
      color: #e9e2d0;
      opacity: 0.92;
    }
    .question .q-mark { color: #f3d98a; font-family: 'Permanent Marker', cursive; font-size: 34px; }

    /* ---------- hero: the record number ---------- */
    .hero {
      position: relative;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: center;
      gap: 2px;
    }

    .circle-wrap {
      position: relative;
      width: 486px;
      height: 486px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-doodle { position: absolute; inset: 0; width: 100%; height: 100%; }
    .circle-doodle path { stroke: #f3d98a; opacity: 0.55; }

    .sparkle { position: absolute; opacity: 0.85; }
    .sparkle path, .sparkle line { stroke: #f2ecdc; }
    .sp1 { width: 46px; height: 46px; top: 8px; left: -6px; }
    .sp2 { width: 34px; height: 34px; bottom: 30px; right: -18px; }
    .sp3 { width: 30px; height: 30px; top: 60px; right: 12px; }

    .number {
      position: relative;
      font-family: 'Permanent Marker', cursive;
      font-size: 270px;
      line-height: 1;
      color: #f3d98a;
      text-shadow:
        0 0 18px rgba(243,217,138,0.35),
        0 0 40px rgba(243,217,138,0.15);
    }

    .unit {
      margin-top: -6px;
      font-family: 'Permanent Marker', cursive;
      font-size: 58px;
      letter-spacing: 4px;
      color: #f2ecdc;
    }

    .script-line {
      margin-top: 4px;
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 40px;
      color: #f0b3c4;
      transform: rotate(-2deg);
    }

    /* ---------- footer badge ---------- */
    .badge-wrap {
      position: relative;
      margin-top: 8px;
      width: 132px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-doodle { position: absolute; inset: 0; width: 100%; height: 100%; }
    .badge-doodle path { stroke: #f2ecdc; opacity: 0.65; }
    .badge-text {
      position: relative;
      text-align: center;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      line-height: 1.05;
    }
    .badge-text .n { display: block; font-size: 40px; color: #f2ecdc; }
    .badge-text .s { display: block; font-size: 22px; color: #cfc7b3; margin-top: -2px; }

    /* ---------- bunting across the top ---------- */
    .bunting { position: absolute; top: -4px; left: 0; width: 100%; height: 150px; z-index: 3; }
    .bunting .string { stroke: #cbc2a8; stroke-width: 2; fill: none; opacity: 0.55; }

    /* ---------- warm string lights along the bottom ---------- */
    .lights { position: absolute; left: 0; bottom: 0px; width: 100%; height: 90px; z-index: 3; }
    .lights .string { stroke: #7c7364; stroke-width: 2; fill: none; opacity: 0.5; }
    .bulb-glow { filter: url(#bulbGlow); }

    @keyframes twinkle {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
  </style>
