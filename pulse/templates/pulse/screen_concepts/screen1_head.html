  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,900&family=IBM+Plex+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; }

    .stage {
      width: 1920px;
      height: 1080px;
      background: #141210;
      color: #F3EFE6;
      font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* corner registration marks — quiet print-annual detail, not decoration */
    .reg {
      position: absolute;
      width: 22px;
      height: 22px;
      opacity: 0.28;
    }
    .reg::before, .reg::after {
      content: '';
      position: absolute;
      background: #F3EFE6;
    }
    .reg::before { width: 22px; height: 1px; top: 0; left: 0; }
    .reg::after  { width: 1px; height: 22px; top: 0; left: 0; }
    .reg.tl { top: 40px; left: 40px; }
    .reg.tr { top: 40px; right: 40px; transform: scaleX(-1); }
    .reg.bl { bottom: 40px; left: 40px; transform: scaleY(-1); }
    .reg.br { bottom: 40px; right: 40px; transform: scale(-1, -1); }

    .frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 64px 120px 56px;
      display: flex;
      flex-direction: column;
    }

    /* ---- meta bar ---- */
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.55);
    }
    .meta .accent-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #E1462A;
      margin-right: 10px;
      transform: translateY(-1px);
    }
    .rule {
      height: 1px;
      width: 100%;
      background: rgba(243, 239, 230, 0.18);
      margin-top: 20px;
    }

    /* ---- question ---- */
    .question-block {
      display: flex;
      align-items: flex-start;
      gap: 26px;
      margin-top: 44px;
    }
    .bullet {
      width: 15px;
      height: 15px;
      background: #E1462A;
      flex: none;
      margin-top: 14px;
    }
    .question {
      font-weight: 700;
      font-size: 58px;
      line-height: 1.16;
      letter-spacing: -0.01em;
      max-width: 1540px;
      color: #F3EFE6;
    }

    .overall {
      margin-top: 18px;
      margin-left: 41px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 16px;
      letter-spacing: 0.06em;
      color: rgba(243, 239, 230, 0.58);
    }
    .overall b {
      color: #F3EFE6;
      font-weight: 500;
    }
    .overall .accent-text {
      color: #E1462A;
      font-weight: 500;
    }

    .rule.lower { margin-top: 40px; }

    /* ---- hero: three-way breakdown ---- */
    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 4px;
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-left: 1px solid rgba(243, 239, 230, 0.18);
      padding: 0 20px;
    }
    .col:first-child { border-left: none; }

    .col-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 16px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.72);
      margin-bottom: 28px;
    }
    .col-label .mark {
      width: 9px;
      height: 9px;
      background: #E1462A;
      flex: none;
      visibility: hidden;
    }
    .col-label.lead .mark { visibility: visible; }

    .figure {
      display: flex;
      align-items: flex-start;
      line-height: 1;
    }
    .figure .int {
      font-weight: 900;
      font-size: 268px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums lining-nums;
      color: #F3EFE6;
    }
    .figure .dec {
      display: flex;
      flex-direction: column;
      margin-left: 10px;
      margin-top: 20px;
      color: #E1462A;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .figure .dec .frac {
      font-weight: 700;
      font-size: 62px;
      line-height: 0.92;
    }
    .figure .dec .pct {
      font-weight: 700;
      font-size: 40px;
      line-height: 0.95;
      opacity: 0.82;
      margin-top: 4px;
    }

    .col-meta {
      margin-top: 30px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 16px;
      letter-spacing: 0.1em;
      color: rgba(243, 239, 230, 0.5);
      text-transform: uppercase;
    }
    .col-meta b {
      color: rgba(243, 239, 230, 0.85);
      font-weight: 500;
    }

    /* ---- footer ---- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 40px;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.4);
    }
  </style>
