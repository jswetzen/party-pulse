  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;

    /* ---------- velvet curtain edges ---------- */
    .curtain {
      position: absolute;
      top: 0;
      width: 340px;
      height: 1080px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.32) 0px,
        rgba(0,0,0,0.32) 18px,
        rgba(255,255,255,0.03) 18px,
        rgba(255,255,255,0.03) 36px,
        rgba(0,0,0,0.18) 36px,
        rgba(0,0,0,0.18) 56px
      );
      background-color: #3a0f28;
      mix-blend-mode: multiply;
      opacity: 0.85;
    }
    .curtain-left { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent 100%); mask-image: linear-gradient(90deg, #000 55%, transparent 100%); }
    .curtain-right { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 55%, transparent 100%); mask-image: linear-gradient(270deg, #000 55%, transparent 100%); }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 1300px 850px at 50% 46%, transparent 55%, rgba(6,1,6,0.72) 100%);
      pointer-events: none;
    }

    /* ---------- spotlight beams ---------- */
    .beam {
      position: absolute;
      top: -60px;
      width: 480px;
      height: 920px;
      background: linear-gradient(180deg, rgba(255,224,150,0.30) 0%, rgba(255,224,150,0.10) 45%, transparent 85%);
      mix-blend-mode: screen;
      opacity: 0.75;
    }
    .beam-l { left: 260px; clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%); transform: rotate(-3deg); }
    .beam-c { left: 720px; width: 480px; clip-path: polygon(42% 0%, 58% 0%, 96% 100%, 4% 100%); }
    .beam-r { left: 1180px; clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%); transform: rotate(3deg); }

    .floor-glow {
      position: absolute;
      left: 380px;
      top: 850px;
      width: 1160px;
      height: 180px;
      background: radial-gradient(ellipse 580px 90px at 50% 30%, rgba(243,206,114,0.35) 0%, transparent 72%);
      mix-blend-mode: screen;
    }

    .winner-glow {
      position: absolute;
      left: 700px;
      top: 380px;
      width: 520px;
      height: 560px;
      background: radial-gradient(ellipse 260px 280px at 50% 50%, rgba(243,206,114,0.55) 0%, transparent 70%);
      mix-blend-mode: screen;
      animation: pulseGlow 3.2s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      from { opacity: 0.55; transform: scale(0.96); }
      to   { opacity: 0.95; transform: scale(1.05); }
    }

    /* ---------- confetti ---------- */
    .confetti {
      position: absolute;
      width: 16px;
      height: 9px;
      border-radius: 2px;
      opacity: 0.9;
    }
    .spark {
      position: absolute;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(10px) rotate(calc(var(--rot, 0deg) + 8deg)); }
    }

    /* ---------- header marquee plaque ---------- */
    .marquee {
      position: absolute;
      left: 160px;
      top: 40px;
      width: 1600px;
      height: 196px;
      background: linear-gradient(180deg, #521a3a 0%, #37102a 100%);

      border-radius: 14px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .bulb-row {
      position: absolute;
      left: 22px;
      width: 1556px;
      height: 14px;
      background-image: radial-gradient(circle, #f7d98a 0 5px, transparent 6px);
      background-size: 46px 14px;
      background-repeat: repeat-x;
      filter: drop-shadow(0 0 5px rgba(247,217,138,0.85));
    }
    .bulb-row.top { top: -7px; }
    .bulb-row.bottom { bottom: -7px; }

    .eyebrow {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 30px;
      letter-spacing: 0.5em;
      color: #f0c163;
      text-indent: 0.5em; /* compensate for trailing letter-spacing on centered text */

    .question {
      font-family: 'Anton', 'Arial Narrow', sans-serif;
      font-size: 62px;
      letter-spacing: 0.01em;
      color: #fbeedb;
      text-shadow: 0 3px 0 rgba(0,0,0,0.4);
      line-height: 1;
      white-space: nowrap;
    }
    .subline {
      font-family: 'Barlow Semi Condensed', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 0.18em;
      color: #cbb3c4;
    }
    .subline b { color: #f0c163; font-weight: 700; }

    /* ---------- podium columns ---------- */
    .col {
      position: absolute;
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .medal {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 40px;
      border: 3px solid rgba(0,0,0,0.25);
      box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    }
    .name-tag {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 46px;
      letter-spacing: 0.08em;
      color: #fbeedb;
      text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
    .pct {
      font-family: 'Anton', sans-serif;
      font-size: 80px;
      line-height: 1;
      color: #f7d98a;
      text-shadow: 0 3px 0 rgba(0,0,0,0.4);
    }

    .block {
      position: absolute;
      width: 300px;
      border-top: 12px solid;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 -30px 40px rgba(0,0,0,0.12);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }
    .block .rank-num {
      margin-top: 14px;

    }

    .gold   { background: linear-gradient(180deg, #e6bb56 0%, #c99a2e 60%, #b3841f 100%); border-color: #f6dfa0; }

    .gold-medal { background: linear-gradient(180deg, #f3ce72 0%, #c99a2e 100%); color: #4a2a0d; }

    .silver { background: linear-gradient(180deg, #d7dee4 0%, #adb8c1 60%, #94a0aa 100%); border-color: #eef2f5; }

    .silver-medal { background: linear-gradient(180deg, #e9eef2 0%, #adb8c1 100%); color: #263038; }

    .bronze { background: linear-gradient(180deg, #cd8a56 0%, #a4602f 60%, #8a4e24 100%); border-color: #e3ac7c; }

    .bronze-medal { background: linear-gradient(180deg, #d69361 0%, #a4602f 100%); color: #3a1c0a; }

    /* ---------- supporting 4th/5th list ---------- */
    .also-label {

      top: 936px;

      height: 78px;

    .chip .rank-circle {
