<div class="question-card" id="question-{{ question.id }}">
  <p>{{ question.text_sv }}</p>
  {% if error %}<p style="color:var(--rose)">{{ error }}</p>{% endif %}
  <form hx-post="{% url 'answer-question' respondent.id question.id %}"
        hx-target="#question-{{ question.id }}" hx-swap="outerHTML">
    {% csrf_token %}
    {% if question.type == "boolean" %}
      <div class="choices choices--row">
        <button class="choice" name="answer" value="true">Ja</button>
        <button class="choice" name="answer" value="false">Nej</button>
      </div>
    {% elif question.type == "multiple_choice" %}
      <div class="choices">
        {% for option in question.options %}
          <button class="choice" name="answer" value="{{ option }}"><span class="choice__dot"></span>{{ option }}</button>
        {% endfor %}
      </div>
    {% elif question.type == "number" %}
      <input type="number" name="answer" required>
      <button type="submit" style="margin-top:0.7rem">Svara</button>
    {% endif %}
  </form>
</div>
