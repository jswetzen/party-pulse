{% extends "pulse/base.html" %}
{% load l10n %}
{% block title %}Storbildsstyrning — Party Pulse{% endblock %}
{% block content %}
  <div class="host-page">
    <p class="wordmark">Party<span>Pulse</span></p>
    <h1>Storbildsstyrning</h1>
    <nav class="host-nav">
      <a class="btn secondary" href="{% url 'host-home' %}">&larr; Värdpanel</a>
      <a class="btn secondary" href="{% url 'screen-display' %}" target="_blank">Öppna storbild &nearr;</a>
    </nav>

    <form method="post" class="card">
      {% csrf_token %}
      <label>Läge
        <select name="mode">
          <option value="statistics" {% if state.mode == "statistics" %}selected{% endif %}>Statistik</option>
          <option value="guessing_game" {% if state.mode == "guessing_game" %}selected{% endif %}>Gissningslek</option>
        </select>
      </label>
      <label>Fråga
        <select name="question">
          <option value="">—</option>
          {% for q in live_questions %}
            <option value="{{ q.id }}" {% if state.question_id == q.id %}selected{% endif %}>{{ q.text_sv }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Uppdelning
        <select name="breakdown">
          <option value="overall" {% if state.breakdown == "overall" %}selected{% endif %}>Alla</option>
          <option value="sex" {% if state.breakdown == "sex" %}selected{% endif %}>Kön</option>
          <option value="age" {% if state.breakdown == "age" %}selected{% endif %}>Åldersgrupp</option>
          <option value="side" {% if state.breakdown == "side" %}selected{% endif %}>Sida</option>
          <option value="relation" {% if state.breakdown == "relation" %}selected{% endif %}>Relation</option>
        </select>
      </label>
      <label>Beräkning (endast nummer-frågor)
        <select name="aggregation">
          <option value="">—</option>
          <option value="avg" {% if state.aggregation == "avg" %}selected{% endif %}>Medel</option>
          <option value="median" {% if state.aggregation == "median" %}selected{% endif %}>Median</option>
          <option value="min" {% if state.aggregation == "min" %}selected{% endif %}>Min</option>
          <option value="max" {% if state.aggregation == "max" %}selected{% endif %}>Max</option>
          <option value="count_above_threshold" {% if state.aggregation == "count_above_threshold" %}selected{% endif %}>Antal över tröskel</option>
        </select>
      </label>
      <label>Tröskel
        <input type="number" name="aggregation_threshold" value="{{ state.aggregation_threshold|unlocalize|default:'' }}">
      </label>
      <div class="choices" style="display:flex;gap:0.6rem;margin-top:0.3rem">
        <button type="submit" name="action" value="show" class="secondary">Visa fråga (utan resultat)</button>
        <button type="submit" name="action" value="reveal">Visa resultat</button>
      </div>
    </form>

    <span class="host-status{% if state.revealed %} host-status--live{% endif %}">
      {% if state.revealed %}● Resultat visas{% else %}○ Väntar{% endif %}
    </span>
  </div>
{% endblock %}
