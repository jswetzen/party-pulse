[project]
name = "party-pulse"
version = "0.1.0"
description = "Self-hosted anonymous party-questionnaire app with live big-screen stats and a guessing game."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "django-htmx>=1.28.0",
    "gunicorn>=26.0.0",
    "qrcode>=8.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.7.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "partypulse.settings"
python_files = ["test_*.py"]
env = ["DJANGO_DEBUG=1"]
